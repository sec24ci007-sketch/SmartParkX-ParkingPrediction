<!DOCTYPE html>
<html>
<head>
  <title>SmartParkX</title>

  <style>

    body{
      font-family: Arial;
      background:#0f172a;
      color:white;
      padding:40px;
    }

    .card{
      background:#1e293b;
      padding:20px;
      margin:15px 0;
      border-radius:10px;
    }

    button{
      background:#06b6d4;
      border:none;
      padding:10px 15px;
      color:white;
      border-radius:5px;
      cursor:pointer;
    }

  </style>
</head>

<body>

<h1>SmartParkX</h1>

<p>AI Powered Smart Parking System</p>

<div class="card">
  <h3>Block A</h3>
  <p>Status: Available</p>
  <button>Book Slot</button>
</div>

<div class="card">
  <h3>Block B</h3>
  <p>Status: Occupied</p>
  <button disabled>Unavailable</button>
</div>

<div class="card">
  <h3>Mall Parking</h3>
  <p>Status: Available</p>
  <button>Book Slot</button>
</div>

</body>
</html>
